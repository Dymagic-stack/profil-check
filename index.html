<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil-Einschätzung | Transparenz Jugendhilfe</title>
  <style>
    :root {
      --primary: #2d8a7c;
      --primary-hover: #246f63;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #667085;
      --border: #d0d5dd;
      --success-bg: #ecfdf3;
      --success-border: #a6f4c5;
      --success-text: #027a48;
      --neutral-bg: #f8f9fa;
      --neutral-border: #eaecf0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    /* Dunkler Kontrast-Container für das weiße Logo */
    .logo-wrapper {
      background-color: var(--primary);
      padding: 16px 24px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .header-logo {
      max-width: 190px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .header h1 {
      font-size: 1.6rem;
      margin: 12px 0 6px 0;
      color: var(--text);
    }

    .header p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .question-group {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--neutral-border);
    }

    .question-group:last-of-type {
      border-bottom: none;
    }

    .question-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 12px;
      display: block;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: all 0.15s ease;
    }

    .option-label:hover {
      background-color: #f9fafb;
      border-color: #98a2b3;
    }

    .option-label input[type="radio"] {
      margin-right: 12px;
      accent-color: var(--primary);
      width: 17px;
      height: 17px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .result-view {
      display: none;
      text-align: center;
      padding: 20px 8px;
    }

    .result-card {
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    .result-success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
    }

    .result-success h2 {
      color: var(--success-text);
      margin-top: 0;
      font-size: 1.35rem;
    }

    .result-rejection {
      background-color: var(--neutral-bg);
      border: 1px solid var(--neutral-border);
    }

    .result-rejection h2 {
      margin-top: 0;
      font-size: 1.35rem;
      color: var(--text);
    }

    .btn-jobs {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.15s ease;
    }

    .btn-jobs:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>

    <div class="logo-wrapper">
      <img
